<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Service Areas API Response</title>
</head>
<body>
    <h1>Debug Service Areas API Response</h1>
    <div id="results"></div>

    <script>
        async function debugServiceAreasAPI() {
            const results = document.getElementById('results');
            
            try {
                console.log('Testing service areas API...');
                const response = await fetch('https://www.aliss.org/api/v4/service-areas/');
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Full API response:', data);
                    
                    results.innerHTML = `
                        <h2>API Response Debug</h2>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Response type:</strong> ${typeof data}</p>
                        <p><strong>Is Array:</strong> ${Array.isArray(data)}</p>
                        <p><strong>Has results property:</strong> ${data.hasOwnProperty('results')}</p>
                        <p><strong>Has data property:</strong> ${data.hasOwnProperty('data')}</p>
                        <p><strong>Keys:</strong> ${Object.keys(data).join(', ')}</p>
                        <h3>Raw Response (first 1000 chars):</h3>
                        <pre style="background: #f0f0f0; padding: 10px; overflow: auto; max-height: 300px;">${JSON.stringify(data, null, 2).substring(0, 1000)}...</pre>
                    `;
                    
                    // Try to find array of service areas
                    let serviceAreas = null;
                    if (data.results && Array.isArray(data.results)) {
                        serviceAreas = data.results;
                    } else if (Array.isArray(data)) {
                        serviceAreas = data;
                    } else if (data.data && Array.isArray(data.data)) {
                        serviceAreas = data.data;
                    }
                    
                    if (serviceAreas) {
                        results.innerHTML += `<p><strong>Found service areas array with ${serviceAreas.length} items</strong></p>`;
                        
                        // Look for our test areas
                        const testSlugs = ['glasgow-city', 'city-of-edinburgh', 'clackmannanshire'];
                        testSlugs.forEach(slug => {
                            const found = serviceAreas.find(area => area.slug === slug);
                            if (found) {
                                let geometryType = 'none';
                                if (found.geometry) {
                                    geometryType = found.geometry.type;
                                } else if (found.geojson) {
                                    try {
                                        const geoJsonObj = JSON.parse(found.geojson);
                                        geometryType = geoJsonObj.geometry?.type || 'parsed but no geometry';
                                    } catch (e) {
                                        geometryType = 'geojson parse error';
                                    }
                                }
                                results.innerHTML += `<p>✅ Found ${slug}: ${found.name || 'No name'} (geometry: ${geometryType})</p>`;
                            } else {
                                results.innerHTML += `<p>❌ Not found: ${slug}</p>`;
                            }
                        });
                    } else {
                        results.innerHTML += '<p><strong>❌ Could not find service areas array in response</strong></p>';
                    }
                    
                } else {
                    results.innerHTML = `<p>❌ API Error: ${response.status} - ${response.statusText}</p>`;
                }
            } catch (error) {
                results.innerHTML = `<p>❌ Network Error: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }
        
        // Run on page load
        debugServiceAreasAPI();
    </script>
</body>
</html>
